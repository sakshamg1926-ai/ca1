
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Navigation Menu</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        /* Navigation Bar */
        nav {
            background-color: #172554;
            color: white;
            padding: 15px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo {
            font-size: 23px;
            font-weight: bold;
        }

        .logo span {
            color: #60a5fa;
        }

        /* Navigation Links */
        .nav-menu {
            display: flex;
            list-style: none;
            gap: 10px;
        }

        .nav-menu a {
            display: block;
            text-decoration: none;
            color: white;
            padding: 10px 16px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-menu a:hover {
            background-color: #2563eb;
        }

        /* Toggle Button */
        .menu-btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .menu-btn:hover {
            background-color: #1d4ed8;
        }

        /* Main Content */
        .content {
            text-align: center;
            padding: 100px 20px;
        }

        .content h1 {
            color: #172554;
            font-size: 36px;
            margin-bottom: 15px;
        }

        .content p {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
        }

        /* Mobile Responsive Design */
        @media (max-width: 600px) {
            nav {
                align-items: center;
            }

            .nav-menu {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 15px;
                gap: 5px;
            }

            .nav-menu.show {
                display: flex;
            }

            .nav-menu a {
                background-color: #1e3a8a;
            }

            .nav-menu a:hover {
                background-color: #2563eb;
            }

            .content h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <div class="logo">KIET <span>DEEMED TO BE UNIVERSITY</span></div>

        <button class="menu-btn" id="toggleBtn">
            ☰ Hide Menu
        </button>

        <ul class="nav-menu" id="navMenu">
            <li><a href="#home">Home</a></li>
            <li><a href="#about">About</a></li>
            <li><a href="#courses">Courses</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <section class="content" id="home">
        <h1>Welcome to KIET DEEMED TO BE UNIVERSITY</h1>
        <p>Learn, Grow and Build Your Future With Us.</p>
    </section>

    <script>
        const toggleBtn = document.getElementById("toggleBtn");
        const navMenu = document.getElementById("navMenu");

        toggleBtn.addEventListener("click", function () {
            if (navMenu.style.display === "none") {
                navMenu.style.display = "";
                navMenu.classList.add("show");
                toggleBtn.innerHTML = "☰ Hide Menu";
            } else {
                navMenu.style.display = "none";
                toggleBtn.innerHTML = "☰ Show Menu";
            }
        });
    </script>

</body>
</html>
